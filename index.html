<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1a22">
<title>반반 얼굴</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪞</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b1a22;        /* 거울 뒷면 */
    --plum:#2a2733;
    --silver:#d9dbe3;     /* 거울 은박 */
    --paper:#f3f1f6;
    --left:#7fb6c9;       /* 왼쪽 반 */
    --right:#e3a08c;      /* 오른쪽 반 */
    --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --display:"Gowun Batang","Apple SD Gothic Neo",serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;
    -webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus-visible,label:focus-within,input:focus-visible{outline:2px solid var(--silver);outline-offset:3px}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column}
  [hidden]{display:none !important}

  /* ── 촬영 화면 ── */
  #video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #video.mirror{transform:scaleX(-1)}
  .guide{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center}
  .guide i{display:block;width:min(62vw,46vh);aspect-ratio:3/4;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.75);box-shadow:0 0 0 100vmax rgba(27,26,34,.45);position:relative}
  .guide i::after{content:"";position:absolute;left:50%;top:-6%;bottom:-6%;
    border-left:1.5px dashed rgba(255,255,255,.8)}
  .top{position:relative;padding:calc(env(safe-area-inset-top,0px) + 18px) 22px 0;text-align:center}
  .top h1{font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:.02em}
  .top p{margin-top:6px;font-size:.92rem;opacity:.85}
  .bar{position:relative;margin-top:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:18px 26px calc(env(safe-area-inset-bottom,0px) + 26px)}
  .ghost{justify-self:start;padding:10px 14px;border-radius:999px;background:rgba(27,26,34,.6);font-size:.9rem}
  .bar .ghost:last-child{justify-self:end}
  #shoot{width:76px;height:76px;border-radius:50%;background:var(--paper);
    box-shadow:0 0 0 4px var(--ink),0 0 0 6px var(--paper);
    background-image:linear-gradient(90deg,var(--left) 50%,var(--right) 50%)}
  #shoot:active{transform:scale(.94)}
  #file{position:absolute;opacity:0;width:1px;height:1px}

  /* ── 결과 화면 ── */
  #result{background:var(--ink)}
  .panel{flex:1 1 0;min-height:0;position:relative;overflow:hidden}
  .panel + .panel{border-top:1px solid rgba(217,219,227,.18)}
  /* 칸 크기에 맞춰 얼굴 전체가 잘리지 않고 들어가도록 */
  .panel canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
  .panel.l{background:linear-gradient(90deg,#20303a,var(--plum) 60%)}
  .panel.o{background:var(--plum)}
  .panel.r{background:linear-gradient(270deg,#3a2a27,var(--plum) 60%)}
  .tag{position:absolute;left:14px;bottom:10px;font-family:var(--display);font-size:.95rem;
    padding:3px 10px;border-radius:4px;background:rgba(27,26,34,.7)}
  .l .tag{border-left:3px solid var(--left)}
  .r .tag{border-left:3px solid var(--right)}
  .o .tag{border-left:3px solid var(--silver)}
  .adjusting .panel.o::after{content:"";position:absolute;left:50%;top:0;bottom:0;
    border-left:1.5px dashed #fff;mix-blend-mode:difference}
  .actions{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);
    display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .actions button{padding:9px 14px;border-radius:999px;background:rgba(27,26,34,.78);
    border:1px solid rgba(217,219,227,.35);font-size:.9rem}
  #adjust{position:absolute;left:0;right:0;bottom:0;background:rgba(27,26,34,.94);
    border-top:1px solid rgba(217,219,227,.3);
    padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 16px);display:grid;gap:10px}
  #adjust label{display:grid;grid-template-columns:5.5em 1fr;align-items:center;gap:12px;font-size:.9rem}
  #adjust input{width:100%;accent-color:var(--silver)}
  #adjust .row{display:flex;justify-content:space-between;gap:10px}
  #adjust .row button{padding:8px 16px;border-radius:999px;border:1px solid rgba(217,219,227,.35)}
  #toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:82vw;text-align:center;
    background:rgba(27,26,34,.92);border:1px solid rgba(217,219,227,.35);padding:12px 18px;border-radius:10px;
    font-size:.95rem;line-height:1.5;z-index:9}
</style>
</head>
<body>

<main id="cam" class="screen">
  <video id="video" class="mirror" playsinline autoplay muted></video>
  <div class="guide"><i></i></div>
  <div class="top">
    <h1>반반 얼굴</h1>
    <p>점선에 코를 맞추고 정면을 봐 주세요</p>
  </div>
  <div class="bar">
    <label class="ghost" tabindex="0">사진 고르기<input id="file" type="file" accept="image/*"></label>
    <button id="shoot" aria-label="사진 찍기"></button>
    <button id="flip" class="ghost">카메라 전환</button>
  </div>
</main>

<main id="result" class="screen" hidden>
  <section class="panel l"><canvas id="cL"></canvas><span class="tag">왼쪽 얼굴만으로</span></section>
  <section class="panel o"><canvas id="cO"></canvas><span class="tag">원래 얼굴</span></section>
  <section class="panel r"><canvas id="cR"></canvas><span class="tag">오른쪽 얼굴만으로</span></section>
  <div class="actions">
    <button id="retake">다시 찍기</button>
    <button id="save">사진 저장</button>
    <button id="openAdjust">중심선 조정</button>
  </div>
  <div id="adjust" hidden>
    <label>좌우 위치<input id="dx" type="range" min="-0.2" max="0.2" step="0.002" value="0"></label>
    <label>기울기<input id="da" type="range" min="-20" max="20" step="0.2" value="0"></label>
    <div class="row"><button id="resetAdjust">자동값으로 되돌리기</button><button id="closeAdjust">조정 끝내기</button></div>
  </div>
</main>

<div id="toast" hidden role="status"></div>

<script type="module">
const $ = id => document.getElementById(id);
const video = $('video'), cam = $('cam'), result = $('result'), toastEl = $('toast');
let stream = null, facing = 'user';
let src = null;                       // 촬영 원본 캔버스
let base = null;                      // {cx, cy, theta, H, oval}
let hairMask = null;                  // 원본 좌표계의 머리카락 마스크 (알파 = 머리카락일 확률)
const adj = {dx:0, da:0};
const aligned = document.createElement('canvas');

/* ── 알림 ── */
let toastTimer;
function toast(msg, ms=2600){
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toastTimer);
  if(ms) toastTimer = setTimeout(()=>toastEl.hidden = true, ms);
}

/* ── AI 모델 (MediaPipe, 기기 안에서 실행). 불러오기에 실패해도 앱은 동작 ── */
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODELS = 'https://storage.googleapis.com/mediapipe-models';
const visionReady = (async()=>{
  try{
    const m = await import(`${MP}/vision_bundle.mjs`);
    return {m, fileset: await m.FilesetResolver.forVisionTasks(`${MP}/wasm`)};
  }catch(e){ console.warn('vision load failed', e); return null; }
})();
// 얼굴 윤곽·중심선
const landmarkerReady = visionReady.then(v=> v && v.m.FaceLandmarker.createFromOptions(v.fileset,{
  baseOptions:{modelAssetPath:`${MODELS}/face_landmarker/face_landmarker/float16/1/face_landmarker.task`},
  runningMode:'IMAGE', numFaces:1
})).catch(e=>{ console.warn('face model failed', e); return null; });
// 머리카락 분할 (0 배경, 1 머리카락, 2 몸 피부, 3 얼굴 피부, 4 옷, 5 기타)
const segmenterReady = visionReady.then(v=> v && v.m.ImageSegmenter.createFromOptions(v.fileset,{
  baseOptions:{modelAssetPath:`${MODELS}/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite`},
  runningMode:'IMAGE', outputCategoryMask:false, outputConfidenceMasks:true
})).catch(e=>{ console.warn('hair model failed', e); return null; });

/* ── 카메라 ── */
async function startCamera(){
  stopCamera();
  if(!navigator.mediaDevices?.getUserMedia){
    toast('이 브라우저는 카메라를 열 수 없습니다. "사진 고르기"로 사진을 넣어 주세요.', 0); return;
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:facing, width:{ideal:1280}, height:{ideal:1280}}, audio:false});
    video.srcObject = stream;
    video.classList.toggle('mirror', facing==='user');
    toastEl.hidden = true;
  }catch(e){
    toast('카메라 권한이 꺼져 있습니다. 브라우저 설정에서 카메라를 허용하거나 "사진 고르기"를 눌러 주세요.', 0);
  }
}
function stopCamera(){ stream?.getTracks().forEach(t=>t.stop()); stream = null; }

$('flip').onclick = ()=>{ facing = facing==='user' ? 'environment' : 'user'; startCamera(); };

$('shoot').onclick = ()=>{
  if(!video.videoWidth){ toast('카메라가 아직 준비되지 않았습니다.'); return; }
  const c = document.createElement('canvas');
  c.width = video.videoWidth; c.height = video.videoHeight;
  const x = c.getContext('2d');
  if(facing==='user'){ x.translate(c.width,0); x.scale(-1,1); }   // 화면에 보이던 거울 모습 그대로
  x.drawImage(video,0,0);
  process(c);
};

$('file').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const img = new Image();
  img.onload = ()=>{
    const s = Math.min(1, 1600/Math.max(img.naturalWidth,img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(img.src); process(c);
  };
  img.onerror = ()=>toast('이 파일은 사진으로 열 수 없습니다.');
  img.src = URL.createObjectURL(f);
  e.target.value = '';
};

/* ── 코 선(얼굴 중심선)과 얼굴 윤곽 찾기 ── */
const MIDLINE = [10,151,9,8,168,6,197,195,5,4,1,2,164,0,17,18,200,199,175,152];
const OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,
              148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
function findMidline(lm, w, h){
  const px = i=>({x:lm[i].x*w, y:lm[i].y*h});
  const pts = MIDLINE.map(px);
  const n = pts.length, my = pts.reduce((s,p)=>s+p.y,0)/n, mx = pts.reduce((s,p)=>s+p.x,0)/n;
  let sxy=0, syy=0;
  for(const p of pts){ sxy += (p.x-mx)*(p.y-my); syy += (p.y-my)**2; }
  const a = syy ? sxy/syy : 0;                    // x = a·y + b
  const theta = Math.atan(a);
  const top = pts[0], chin = pts[n-1];
  const H = Math.hypot(top.x-chin.x, top.y-chin.y);
  let cy = (top.y+chin.y)/2, cx = mx + a*(cy-my);
  cx -= 0.1*H*Math.sin(theta); cy -= 0.1*H*Math.cos(theta);   // 머리카락이 들어가게 조금 위로
  return {cx, cy, theta, H, oval:OVAL.map(px)};
}

/* ── 머리카락 영역 찾기 → 알파 마스크 캔버스 ── */
async function findHair(canvas){
  const seg = await segmenterReady;
  if(!seg) return null;
  const res = seg.segment(canvas);
  try{
    const m = res.confidenceMasks?.[1];
    if(!m) return null;
    const f = m.getAsFloat32Array(), w = m.width, h = m.height;
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d'), img = ctx.createImageData(w,h);
    for(let i=0;i<f.length;i++){
      const a = Math.min(1, Math.max(0, (f[i]-0.25)/0.4));    // 경계를 조금 또렷하게
      img.data[4*i+3] = a*255;
    }
    ctx.putImageData(img,0,0);
    return cv;
  }finally{ res.close?.(); }
}

async function process(canvas){
  src = canvas;
  toast('얼굴과 머리카락을 찾는 중입니다…', 0);
  let found = null; hairMask = null;
  try{
    const lmk = await landmarkerReady;
    const res = lmk?.detect(canvas);
    if(res?.faceLandmarks?.length) found = findMidline(res.faceLandmarks[0], canvas.width, canvas.height);
  }catch(e){ console.warn(e); }
  if(found){ try{ hairMask = await findHair(canvas); }catch(e){ console.warn(e); } }
  base = found ?? {cx:canvas.width/2, cy:canvas.height/2, theta:0, H:Math.min(canvas.width, canvas.height)*0.55, oval:null};
  adj.dx = adj.da = 0; $('dx').value = 0; $('da').value = 0;
  stopCamera();
  cam.hidden = true; result.hidden = false;
  render();
  if(!found){ toast('얼굴을 자동으로 찾지 못해 머리까지 통째로 반전했습니다. 중심선을 직접 맞춰 주세요.', 4000); showAdjust(true); }
  else if(!hairMask) toast('머리카락을 구분하지 못해 얼굴 윤곽 기준으로만 합성했습니다.', 3500);
  else toastEl.hidden = true;
}

/* ── 합성 ── */
// 캔버스의 한쪽 반(sx부터 half 폭)만으로 좌우 대칭 이미지를 만든다
function mirrorHalf(from, sx, half){
  const cv = document.createElement('canvas'); cv.width = from.width; cv.height = from.height;
  const c = cv.getContext('2d');
  c.drawImage(from, sx,0,half,cv.height, sx,0,half,cv.height);
  c.translate(cv.width,0); c.scale(-1,1);
  c.drawImage(from, sx,0,half,cv.height, sx,0,half,cv.height);
  return cv;
}

function render(){
  const th = base.theta + adj.da*Math.PI/180, cos = Math.cos(th), sin = Math.sin(th);
  const half = Math.round(base.H*0.6), W = half*2, Hc = Math.round(base.H*1.55);
  const cx = base.cx + adj.dx*base.H*cos;
  const cy = base.cy - adj.dx*base.H*sin;
  const place = ctx=>{ ctx.translate(W/2, Hc/2); ctx.rotate(th); ctx.translate(-cx, -cy); };

  // 중심선이 정확히 세로 가운데에 오도록 바로 세운 얼굴
  aligned.width = W; aligned.height = Hc;
  const a = aligned.getContext('2d');
  a.fillStyle = '#2a2733'; a.fillRect(0,0,W,Hc);
  place(a); a.drawImage(src,0,0);

  // 같은 방식으로 바로 세운 머리카락 마스크
  let hairA = null;
  if(hairMask){
    hairA = document.createElement('canvas'); hairA.width = W; hairA.height = Hc;
    const hc = hairA.getContext('2d'); hc.imageSmoothingQuality = 'high';
    place(hc); hc.drawImage(hairMask, 0,0, src.width, src.height);
  }

  // 얼굴 윤곽 마스크 (가장자리를 부드럽게): 작게 그린 뒤 확대해서 번지게 한다
  let mask = null;
  if(base.oval){
    const pts = base.oval.map(p=>{ const x = p.x-cx, y = p.y-cy;
      return {x:W/2 + x*cos - y*sin, y:Hc/2 + x*sin + y*cos}; });
    const mx = pts.reduce((s,p)=>s+p.x,0)/pts.length, my = pts.reduce((s,p)=>s+p.y,0)/pts.length;
    const s = Math.max(4, Math.round(base.H*0.04)), k = 0.97;
    const small = document.createElement('canvas');
    small.width = Math.ceil(W/s); small.height = Math.ceil(Hc/s);
    const sc = small.getContext('2d');
    sc.beginPath();
    pts.forEach((p,i)=>{ const x = (mx+(p.x-mx)*k)/s, y = (my+(p.y-my)*k)/s; i ? sc.lineTo(x,y) : sc.moveTo(x,y); });
    sc.closePath(); sc.fill();
    mask = document.createElement('canvas'); mask.width = W; mask.height = Hc;
    const mc = mask.getContext('2d'); mc.imageSmoothingEnabled = true; mc.imageSmoothingQuality = 'high';
    mc.drawImage(small, 0,0, small.width*s, small.height*s);
  }

  const draw = (cv, sx)=>{                 // sx: 쓸 반쪽의 시작 x (0 = 왼쪽, half = 오른쪽)
    cv.width = W; cv.height = Hc;
    const c = cv.getContext('2d');
    const sym = mirrorHalf(aligned, sx, half);
    if(!mask){ c.drawImage(sym,0,0); return; }
    // 대칭 얼굴에서 얼굴 윤곽 안쪽만 남기고,
    const sctx = sym.getContext('2d');
    sctx.setTransform(1,0,0,1,0,0);
    sctx.globalCompositeOperation = 'destination-in';
    sctx.drawImage(mirrorHalf(mask, sx, half),0,0);
    if(hairA){
      // 반전되어 따라온 머리카락과, 원본 머리카락이 덮을 자리는 지운다
      sctx.globalCompositeOperation = 'destination-out';
      sctx.drawImage(mirrorHalf(hairA, sx, half),0,0);
      sctx.drawImage(hairA,0,0);
    }
    // 원래 사진(머리 모양·배경) 위에 얹는다
    c.drawImage(aligned,0,0);
    c.drawImage(sym,0,0);
  };
  draw($('cL'), 0);
  draw($('cR'), half);
  const o = $('cO'); o.width = W; o.height = Hc; o.getContext('2d').drawImage(aligned,0,0);
}

/* ── 조정 ── */
function showAdjust(on){ $('adjust').hidden = !on; result.classList.toggle('adjusting', on); }
$('openAdjust').onclick = ()=>showAdjust($('adjust').hidden);
$('closeAdjust').onclick = ()=>showAdjust(false);
$('dx').oninput = e=>{ adj.dx = +e.target.value; render(); };
$('da').oninput = e=>{ adj.da = +e.target.value; render(); };
$('resetAdjust').onclick = ()=>{ adj.dx = adj.da = 0; $('dx').value = 0; $('da').value = 0; render(); };

$('retake').onclick = ()=>{ showAdjust(false); result.hidden = true; cam.hidden = false; startCamera(); };

/* ── 저장: 세 장을 위·가운데·아래로 붙인 한 장 ── */
$('save').onclick = ()=>{
  const W = aligned.width, H = aligned.height;
  const out = document.createElement('canvas'); out.width = W; out.height = H*3;
  const c = out.getContext('2d');
  c.drawImage($('cL'),0,0); c.drawImage($('cO'),0,H); c.drawImage($('cR'),0,H*2);
  out.toBlob(async blob=>{
    const file = new File([blob], 'half-face.jpg', {type:'image/jpeg'});
    if(navigator.canShare?.({files:[file]})){
      try{ await navigator.share({files:[file]}); return; }catch(e){ if(e.name==='AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'half-face.jpg'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    toast('사진을 저장했습니다.');
  }, 'image/jpeg', 0.92);
};

startCamera();
</script>
</body>
</html>
